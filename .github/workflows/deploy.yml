# Workflow for publishing plugin to WordPress repository
name: Deploy plugin to WordPress.org
on:
  push:
    tags:
      - '*'

jobs:
  notify_start:
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notify Start
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C07HH3EP199",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "WordPress release - build starting - ${{ github.ref_name }}"
                  }
                }
              ]
            }

  build:
    name: Build and deploy
    needs: notify_start
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          tools: composer, cs2pr

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          ASSETS_DIR: 'assets'
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: casa-courses
          VERSION: ${{ github.ref_name }}

  notify_end:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Slack Notify End
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C07HH3EP199",
              "attachments": [
                {
                  "color": "${{ needs.build.result == 'success' && 'good' || 'danger' }}",
                  "title": "WordPress deployment results (${{ github.ref_name }}) - ${{ needs.build.result }}",
                  "fields": [
                    {
                      "value": "Deploy results (${{ github.ref_name }})\nGitHub Action build result: ${{ needs.build.result }}",
                      "short": false
                    }
                  ]
                }
              ]
            }
